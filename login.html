<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GMTT · Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#1a1f2e;--muted:#6b7280;--border:#e5e7eb;--surface:#fff;--blue:#2563eb;--blue-h:#1d4ed8;--err:#dc2626;--bg:#f8fafc;}
    body{font-family:'Geist',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    .wrap{width:100%;max-width:400px}

    /* Brand */
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:40px;justify-content:center}
    .brand-mark{width:44px;height:44px;background:var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Instrument Serif',serif;font-size:22px;flex-shrink:0}
    .brand-name{font-size:20px;font-weight:600;color:var(--ink)}
    .brand-sub{font-size:12px;color:var(--muted);margin-top:1px}

    /* Card */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
    .card-title{font-family:'Instrument Serif',serif;font-size:26px;color:var(--ink);margin-bottom:4px}
    .card-sub{font-size:13px;color:var(--muted);margin-bottom:28px}

    /* Form */
    .field{margin-bottom:18px}
    label{display:block;font-size:12.5px;font-weight:500;color:var(--ink);margin-bottom:6px}
    input{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'Geist',sans-serif;color:var(--ink);background:var(--surface);outline:none;transition:.15s}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    input.err{border-color:var(--err)}
    .err-msg{color:var(--err);font-size:12px;margin-top:5px;display:none}
    .err-msg.show{display:block}

    /* Button */
    .btn{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:'Geist',sans-serif;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
    .btn:hover{background:var(--blue-h)}
    .btn:active{transform:scale(.98)}
    .btn.loading{opacity:.7;pointer-events:none}
    .btn .spin{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
    .btn.loading .spin{display:block}.btn.loading .txt{display:none}
    @keyframes rot{to{transform:rotate(360deg)}}

    /* Divider */
    .divider{display:flex;align-items:center;gap:10px;margin:22px 0;color:var(--muted);font-size:12px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

    /* Footer */
    .footer{text-align:center;margin-top:24px;font-size:12px;color:var(--muted)}
    .footer a{color:var(--blue);text-decoration:none}



    /* Loading overlay */
    .loading-overlay{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
    .loading-overlay.fade{opacity:0;pointer-events:none}
    .lo-mark{width:56px;height:56px;background:var(--blue);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Instrument Serif',serif;font-size:28px;margin-bottom:16px;animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
    .lo-title{font-family:'Instrument Serif',serif;font-size:22px;color:var(--ink);margin-bottom:4px}
    .lo-sub{font-size:13px;color:var(--muted)}
    .lo-bar{width:200px;height:3px;background:#e5e7eb;border-radius:2px;margin-top:20px;overflow:hidden}
    .lo-fill{height:100%;background:var(--blue);border-radius:2px;width:0;transition:width 2.5s ease}
  </style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="overlay">
  <div class="lo-mark">G</div>
  <div class="lo-title">GMTT Workspace</div>
  <div class="lo-sub">Counselor command centre</div>
  <div class="lo-bar"><div class="lo-fill" id="loFill"></div></div>
</div>

<div class="wrap" id="loginWrap" style="opacity:0;transition:opacity .3s">
  <div class="brand">
    <div class="brand-mark">G</div>
    <div>
      <div class="brand-name">GMTT</div>
      <div class="brand-sub">Guiders Mission · Counselor workspace</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Sign in</div>
    <div class="card-sub">Sign in with your Guiders Mission credentials</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@aiingo.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password"/>
        <div class="err-msg" id="errMsg">Incorrect credentials. Please try again.</div>
      </div>
      <button type="submit" class="btn" id="loginBtn">
        <span class="spin"></span>
        <span class="txt">Sign in →</span>
      </button>
    </form>
  </div>

  <div class="footer">
    Guiders Mission Tours and Travels · Powered by <a href="https://aiingo.com" target="_blank">Aiingo</a>
  </div>
</div>

<script>
// Credentials map (extend as needed)
const CREDS = {
  'gmtt@aiingo.com': 'Husu*9895365081',
  'jaipal@gmtt.com': 'gmtt2026',
  'anu@gmtt.com':    'gmtt2026',
};

// Show loading, then reveal login
window.addEventListener('DOMContentLoaded', () => {
  const fill = document.getElementById('loFill');
  const overlay = document.getElementById('overlay');
  const wrap = document.getElementById('loginWrap');

  // If already logged in, go straight to app
  if (sessionStorage.getItem('gmtt_user')) {
    gotoApp(); return;
  }

  setTimeout(() => { fill.style.width = '100%'; }, 50);
  setTimeout(() => {
    overlay.classList.add('fade');
    wrap.style.opacity = '1';
  }, 2800);
});

function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass  = document.getElementById('pass').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('errMsg');

  btn.classList.add('loading');
  err.classList.remove('show');

  setTimeout(() => {
    if (CREDS[email] && CREDS[email] === pass) {
      sessionStorage.setItem('gmtt_user', JSON.stringify({ id: email, name: email.split('@')[0], role: 'Counselor' }));
      launchApp();
    } else {
      btn.classList.remove('loading');
      err.classList.add('show');
      document.getElementById('pass').classList.add('err');
    }
  }, 900);
}

function launchApp() {
  const overlay = document.getElementById('overlay');
  const fill    = document.getElementById('loFill');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'all';
  overlay.classList.remove('fade');
  fill.style.transition = 'width .8s ease';
  fill.style.width = '100%';
  setTimeout(() => { gotoApp(); }, 1000);
}

function gotoApp() {
  window.location.href = 'index-dashboard.html';
}
</script>
</body>
</html>
