server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index login.html;

  # Healthcheck endpoint (always open, never auth-gated)
  location = /health {
    auth_basic off;
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Hide the n8n workflow JSON folder from public browsing.
  # (Files inside still served if linked directly — they aren't secrets,
  #  but the directory index is suppressed.)
  location /n8n-workflows/ {
    autoindex off;
  }

  # Default: gzip and serve static assets with sane cache headers
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location ~* \.(?:css|js|jsx|svg|png|jpg|jpeg|gif|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, must-revalidate";
    try_files $uri =404;
  }

  # HTML — no cache so login/auth changes propagate immediately
  location / {
    add_header Cache-Control "no-store, must-revalidate";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # If BASIC_AUTH=1 at boot, the entrypoint enables these two directives via
    # /etc/nginx/conf.d/gmtt-auth.inc.  Otherwise the include is a no-op file.
    include /etc/nginx/conf.d/gmtt-auth.inc;

    try_files $uri $uri/ =404;
  }

  # Friendly error page → bounce to login if asset missing or unauthorised
  error_page 401 = @login_redirect;
  location @login_redirect {
    return 302 /login.html;
  }
}
