services:
  gmtt:
    build: .
    image: gmtt-dashboard:latest
    container_name: gmtt-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Set to 1 to require nginx-level basic auth as well as the in-app login.
      # Strongly recommended in production.
      BASIC_AUTH: "0"
      # Optional: full htpasswd line. Generate with:
      #   htpasswd -nbB gmtt 'your-real-password'
      # HTPASSWD: "gmtt:$$2y$$05$$..."
    # If you'd rather mount an htpasswd file:
    # volumes:
    #   - ./htpasswd:/etc/nginx/htpasswd:ro
