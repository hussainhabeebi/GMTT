<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GMTT · Counselor workspace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app/styles.css" />
  <script async src="https://js.stripe.com/v3/pricing-table.js"></script>

  <!-- ALL CONFIG INLINE — runs synchronously before React/Babel -->
  <script>
  // ── Login guard ──────────────────────────────────────────────────────────
  (function() {
    var u = sessionStorage.getItem('gmtt_user');
    if (!u) { window.location.href = 'login.html'; return; }
    try { window.GMTT_USER = JSON.parse(u); } catch(e) { window.GMTT_USER = { name:'Counselor', role:'GMTT' }; }
  })();

  // ── Real webhook URLs from n8n workflow ──────────────────────────────────
  var N8N = 'https://n8n.aiingo.com/webhook';
  window.GMTT_API = {
    LEADS:         N8N + '/gmtt/fH9cnX6bchOtZJ9R05uuqarN/leads',
    LEADS_UPDATE:  N8N + '/gmtt/TI2Uco896XOqMQpsA7dX83xj/leads/update',
    CONVERSATIONS: N8N + '/gmtt/poPpDqgxgpRQtAXohgxNm4Pd/conversations',
    EMAIL_SEND:    N8N + '/gmtt/oR9jRW6lmlWBFXAge2kYbzZG/email/send',
    WA_SEND:       N8N + '/gmtt/oHGzPaIDZi9O1TAJjzzJEfAa/whatsapp/send',
    ANALYTICS:     N8N + '/gmtt/ZIvXdtJgKHbFL3WeiJPdqVlc/analytics',
    AUTOMATION:    N8N + '/gmtt/NQn8IEFhmSGUN9pFGUkyUj9W/automation/trigger',
  };

  // ── Chatwoot (direct — for messages, send reply, resolve) ────────────────
  window.GMTT_CW = {
    URL:   'https://app.aiingo.com',
    ACC:   6,
    TOKEN: 'vsBz2BHfdvU5eYifV3VvUBN3',
    PUB:   'https://app.aiingo.com/app/accounts/6',
  };

  // ── Stripe ───────────────────────────────────────────────────────────────
  window.GMTT_STRIPE = {
    PK:    'pk_live_51R1PadJWa5B2ayZg4ytt9Q9hI0b8j3Br1jXy7o1FVsiwBgPt6QGx4wYeWuonnkUyH82xRDNHB54xg95dK7wJkpG900cPYq5DuQ',
    TABLE: 'prctbl_1TaK2NJWa5B2ayZgqa6bHL33',
  };

  // ── localStorage cache ───────────────────────────────────────────────────
  window.LSCache = {
    get:   function(k) { try { var r=localStorage.getItem(k); return r?JSON.parse(r):null; } catch(e){ return null; } },
    set:   function(k,d){ try { localStorage.setItem(k,JSON.stringify(d)); } catch(e){} },
    clear: function(k)  { try { localStorage.removeItem(k); } catch(e){} },
  };

  // Keep old GMTT_CONFIG alias so existing code still works
  window.GMTT_CONFIG = {
    N8N:          N8N,
    CHATWOOT_URL: window.GMTT_CW.URL,
    CHATWOOT_ACC: window.GMTT_CW.ACC,
    CHATWOOT_TOKEN: window.GMTT_CW.TOKEN,
    CHATWOOT_PUB: window.GMTT_CW.PUB,
    STRIPE_PK:    window.GMTT_STRIPE.PK,
    STRIPE_TABLE: window.GMTT_STRIPE.TABLE,
    CACHE_TTL:    300000,
    LS_KEY_LEADS: 'gmtt_leads_v1',
    LS_KEY_CONVS: 'gmtt_convs_v1',
    LS_KEY_SYNC:  'gmtt_last_sync',
  };

  window._memCache = {};
  window.clearApiCache = function(){ window._memCache = {}; };

  // ── Generic fetch helpers ─────────────────────────────────────────────────
  window.gmttGet = async function(url) {
    var r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error(url + ' → HTTP ' + r.status);
    var t = await r.text();
    return t ? JSON.parse(t) : {};
  };

  window.gmttPost = async function(url, body) {
    var r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    if (!r.ok) throw new Error(url + ' → HTTP ' + r.status);
    var t = await r.text();
    return t ? JSON.parse(t) : {};
  };

  // Legacy alias used by data.jsx
  window.apiPost = async function(path, body) {
    // path can be either a full URL or a /webhook/... path
    var url = path.startsWith('http') ? path : (N8N + path);
    return window.gmttPost(url, body);
  };

  window.cwFetch = async function(path, method, body) {
    method = method || 'GET';
    var opts = {
      method: method,
      headers: {
        'api_access_token': window.GMTT_CW.TOKEN,
        'Content-Type':     'application/json',
      },
    };
    if (body) opts.body = JSON.stringify(body);
    var r = await fetch(window.GMTT_CW.URL + '/api/v1/accounts/' + window.GMTT_CW.ACC + path, opts);
    if (!r.ok) throw new Error('Chatwoot' + path + ' → HTTP ' + r.status);
    return r.json();
  };

  // ── Live loaders using REAL URLs ──────────────────────────────────────────
  window.loadLiveLeads = async function() {
    var raw = await window.gmttGet(window.GMTT_API.LEADS);
    var rows = [];
    if (Array.isArray(raw))           rows = raw;
    else if (Array.isArray(raw.rows)) rows = raw.rows;
    else if (Array.isArray(raw.data)) rows = raw.data;
    rows = rows.filter(function(r){ return r && (r['Phone Number'] || r.Name); });
    console.log('[GMTT] leads loaded:', rows.length);
    return rows.map(window.rowToLead || function(r,i){ return r; });
  };

  window.loadLiveConversations = async function(status) {
    status = status || 'open';
    var raw = await window.gmttGet(window.GMTT_API.CONVERSATIONS + '?status=' + status);
    var list = [];
    if (Array.isArray(raw))           list = raw;
    else if (Array.isArray(raw.data)) list = raw.data;
    return list.map(function(c){
      return {
        id:      c.id || ('C-'+Math.random()),
        _cwId:   c._cwId || c.id,
        status:  c.status || 'open',
        unread:  c.unread || 0,
        lastTs:  c.lastTs || '',
        preview: c.preview || '',
        _phone:  c.contactPhone || c._phone || '',
        _name:   c.contactName  || c._name  || 'Unknown',
        assigned:c.assigned || null,
        messages:[],
      };
    });
  };

  window.loadConversationMessages = async function(cwId) {
    var data = await window.cwFetch('/conversations/' + cwId + '/messages');
    var msgs = data && data.payload ? data.payload : [];
    return msgs
      .filter(function(m){ return m.content; })
      .sort(function(a,b){ return a.created_at - b.created_at; })
      .map(function(m){
        return {
          from:   (m.message_type===1||m.message_type==='outgoing') ? 'me' : 'them',
          ts:     new Date((m.created_at||0)*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
          body:   m.content,
          author: m.sender ? m.sender.name : '',
        };
      });
  };

  window.loadLiveTemplates = async function() {
    // Templates come from Meta via n8n — not implemented in this workflow yet
    return [];
  };
  </script>

  <!-- React + Babel (sync) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app/tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/icons.jsx"></script>
  <script type="text/babel" src="app/shell.jsx"></script>
  <script type="text/babel" src="app/today.jsx"></script>
  <script type="text/babel" src="app/leads.jsx"></script>
  <script type="text/babel" src="app/conversations.jsx"></script>
  <script type="text/babel" src="app/email.jsx"></script>
  <script type="text/babel" src="app/whatsapp.jsx"></script>
  <script type="text/babel" src="app/analytics.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>
</body>
</html>
