<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Stripe -->
  <script async src="https://js.stripe.com/v3/pricing-table.js"></script>

  <!-- ① Login guard + Config + Cache — MUST run synchronously before Babel -->
  <script>
    // Login guard
    (function() {
      var user = sessionStorage.getItem('gmtt_user');
      if (!user) { window.location.href = 'login.html'; return; }
      window.GMTT_USER = JSON.parse(user);
    })();

    // Config
    window.GMTT_CONFIG = {
      N8N:            'https://n8n.aiingo.com/webhook',
      CHATWOOT_URL:   'https://app.aiingo.com',
      CHATWOOT_ACC:   6,
      CHATWOOT_TOKEN: 'vsBz2BHfdvU5eYifV3VvUBN3',
      CHATWOOT_PUB:   'https://app.aiingo.com/app/accounts/6',
      WA_PHONE_ID:    '1079935485214110',
      WA_WABA_ID:     '1703472947338466',
      STRIPE_PK:      'pk_live_51R1PadJWa5B2ayZg4ytt9Q9hI0b8j3Br1jXy7o1FVsiwBgPt6QGx4wYeWuonnkUyH82xRDNHB54xg95dK7wJkpG900cPYq5DuQ',
      STRIPE_TABLE:   'prctbl_1TaK2NJWa5B2ayZgqa6bHL33',
      CACHE_TTL:      300000,
      LS_KEY_LEADS:   'gmtt_leads_v1',
      LS_KEY_CONVS:   'gmtt_convs_v1',
      LS_KEY_SYNC:    'gmtt_last_sync',
    };

    // localStorage cache helper
    window.LSCache = {
      get: function(k) {
        try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e) { return null; }
      },
      set: function(k, d) {
        try { localStorage.setItem(k, JSON.stringify(d)); } catch(e) {}
      },
      clear: function(k) {
        try { localStorage.removeItem(k); } catch(e) {}
      }
    };

    // In-memory cache
    window._memCache = {};
    window.clearApiCache = function() { window._memCache = {}; };

    // API helpers
    window.apiPost = async function(path, body) {
      var r = await fetch(GMTT_CONFIG.N8N + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      if (!r.ok) throw new Error('n8n ' + path + ' → HTTP ' + r.status);
      var text = await r.text();
      return text ? JSON.parse(text) : {};
    };

    window.cwFetch = async function(path, method, body) {
      method = method || 'GET';
      var opts = {
        method: method,
        headers: {
          'api_access_token': GMTT_CONFIG.CHATWOOT_TOKEN,
          'Content-Type': 'application/json'
        }
      };
      if (body) opts.body = JSON.stringify(body);
      var r = await fetch(GMTT_CONFIG.CHATWOOT_URL + '/api/v1/accounts/' + GMTT_CONFIG.CHATWOOT_ACC + path, opts);
      if (!r.ok) throw new Error('Chatwoot ' + path + ' → HTTP ' + r.status);
      return r.json();
    };
  </script>

  <!-- ② React + Babel (sync — must be before Babel JSX files) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
</head>

</body>
